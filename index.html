<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>펫메이트 — 반려동물 커뮤니티 & 매칭 플랫폼</title>
  <meta name="description" content="우리 동네 동물병원·펫호텔·도그워커·일반 호스트 매칭. 종별·연령대별 채팅방과 지역 기반 평판 커뮤니티."/>
  <meta property="og:title" content="펫메이트 — 반려동물 커뮤니티 & 매칭"/>
  <meta property="og:description" content="검증된 리뷰, 실시간 채팅, 3D 펫 지도. 반려동물 라이프의 모든 것."/>
  <meta property="og:type" content="website"/>
  <meta name="theme-color" content="#0b0d14"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet"/>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <style>
    :root {
      --bg:#0b0d14; --surface:#13161f; --surface2:#1a1e2e;
      --border:rgba(255,255,255,0.08);
      --accent:#4ade80; --accent2:#60a5fa; --accent3:#f472b6;
      --text:#f0f2f8; --muted:#7b849a; --warm:#fbbf24;
      --nav-h:52px; --ticker-h:34px; --tab-h:44px; --bottom-h:60px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);}
    button{font-family:'Noto Sans KR',sans-serif;}

    .top-nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);
      background:rgba(11,13,20,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 14px;gap:10px;}
    .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:-.5px;flex-shrink:0;cursor:pointer;}
    .logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
    .search-box{flex:1;max-width:300px;position:relative;}
    .search-inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:7px 12px 7px 30px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border .15s;}
    .search-inp:focus{border-color:var(--accent);}
    .search-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5;}
    .search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;max-height:260px;overflow-y:auto;display:none;box-shadow:0 16px 40px rgba(0,0,0,.6);}
    .search-results.show{display:block;}
    .sr-item{padding:10px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
    .sr-item:last-child{border-bottom:none;}
    .sr-item:hover{background:var(--surface2);}
    .nav-btns{display:flex;gap:4px;margin-left:auto;}
    .nav-btn{padding:6px 10px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
    .nav-btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);}
    .nav-btn-primary{background:var(--accent);color:#000;}

    .ticker{position:fixed;top:var(--nav-h);left:0;right:0;z-index:199;height:var(--ticker-h);
      background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;overflow:hidden;}
    .ticker-label{flex-shrink:0;background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:0 10px;height:100%;display:flex;align-items:center;white-space:nowrap;}
    .ticker-track{display:flex;animation:ticker 65s linear infinite;will-change:transform;}
    .ticker-track:hover{animation-play-state:paused;}
    @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .ticker-item{white-space:nowrap;padding:0 28px;font-size:12px;color:var(--muted);cursor:pointer;}
    .ticker-item:hover{color:var(--text);}
    .ticker-item b{color:var(--accent2);margin-right:6px;font-weight:600;}

    .content-tabs{position:fixed;top:calc(var(--nav-h) + var(--ticker-h));left:0;right:0;z-index:198;height:var(--tab-h);
      background:var(--bg);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;}
    .content-tabs::-webkit-scrollbar{display:none;}
    .c-tab{flex:1;min-width:70px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
    .c-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

    .main-area{position:fixed;top:calc(var(--nav-h) + var(--ticker-h) + var(--tab-h));left:0;right:0;bottom:var(--bottom-h);overflow:hidden;}
    .tab-panel{display:none;width:100%;height:100%;}
    .tab-panel.active{display:flex;flex-direction:column;}

    #map{width:100%;flex:1;}
    .map-filters{position:absolute;top:calc(var(--nav-h) + var(--ticker-h) + var(--tab-h) + 10px);left:10px;z-index:100;display:flex;flex-direction:column;gap:5px;}
    .mf-btn{background:rgba(11,13,20,.9);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:7px;font-size:11px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
    .mf-btn.on{border-color:var(--accent);color:var(--accent);}
    .map-view-btns{position:absolute;top:calc(var(--nav-h) + var(--ticker-h) + var(--tab-h) + 10px);right:10px;z-index:100;display:flex;flex-direction:column;gap:5px;}
    .mv-btn{background:rgba(11,13,20,.9);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .15s;}
    .mv-btn:hover{border-color:var(--accent2);color:var(--accent2);}
    .mv-btn.locating{animation:pulse 1s infinite;}
    @keyframes pulse{50%{opacity:.4;}}
    .map-legend{position:absolute;bottom:calc(var(--bottom-h) + 10px);left:10px;z-index:100;background:rgba(11,13,20,.9);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:10px;}
    .leg-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--muted);}
    .leg-row:last-child{margin-bottom:0;}
    .leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .map-count{position:absolute;bottom:calc(var(--bottom-h) + 10px);right:10px;z-index:100;background:rgba(11,13,20,.9);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--muted);}
    .map-count b{color:var(--accent);}

    .chat-panel-inner{display:flex;width:100%;height:100%;}
    .chat-sidebar{width:200px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:10px 8px;}
    .chat-sidebar::-webkit-scrollbar{width:2px;}
    .chat-sidebar::-webkit-scrollbar-thumb{background:var(--border);}
    .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
    @media(max-width:480px){.chat-sidebar{width:150px;}}
    .cs-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:0 4px;margin:10px 0 5px;}
    .cs-label:first-child{margin-top:0;}
    .room-btn{display:flex;align-items:center;gap:7px;padding:7px 6px;border-radius:8px;cursor:pointer;transition:all .12s;margin-bottom:1px;}
    .room-btn:hover,.room-btn.active{background:var(--surface2);}
    .room-btn.active .rb-name{color:var(--text);font-weight:600;}
    .rb-ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
    .rb-name{font-size:11px;color:var(--muted);flex:1;}
    .rb-cnt{font-size:9px;color:var(--accent);background:rgba(74,222,128,.1);padding:1px 5px;border-radius:10px;font-weight:700;}
    .age-btn{display:flex;align-items:center;gap:6px;padding:6px;border-radius:8px;cursor:pointer;transition:all .12s;margin-bottom:1px;}
    .age-btn:hover,.age-btn.active{background:var(--surface2);}
    .age-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;}

    .chat-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .chat-hdr-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;}
    .chat-hdr-info h3{font-size:13px;font-weight:700;}
    .chat-hdr-info p{font-size:10px;color:var(--muted);}
    .typing-dot{display:inline-block;animation:blink 1.2s infinite;}
    @keyframes blink{50%{opacity:.2;}}
    .chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
    .chat-msgs::-webkit-scrollbar{width:2px;}
    .chat-msgs::-webkit-scrollbar-thumb{background:var(--border);}
    .msg{display:flex;gap:7px;max-width:88%;animation:msgIn .25s ease;}
    @keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
    .msg.mine{align-self:flex-end;flex-direction:row-reverse;}
    .msg-av{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px;}
    .msg-nm{font-size:10px;color:var(--muted);margin-bottom:2px;}
    .msg-bub{padding:8px 11px;border-radius:11px;font-size:12px;line-height:1.5;background:var(--surface2);}
    .msg.mine .msg-bub{background:rgba(74,222,128,.13);border:1px solid rgba(74,222,128,.2);}
    .msg-t{font-size:9px;color:var(--muted);margin-top:2px;text-align:right;}
    .chat-inp-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:flex-end;flex-shrink:0;}
    .chat-inp{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;resize:none;max-height:80px;outline:none;}
    .chat-inp:focus{border-color:var(--accent);}
    .chat-send{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#000;border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

    .scroll-panel{overflow-y:auto;padding:14px;width:100%;height:100%;}
    .scroll-panel::-webkit-scrollbar{width:3px;}
    .scroll-panel::-webkit-scrollbar-thumb{background:var(--border);}
    .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:400px){.match-grid{grid-template-columns:1fr;}}
    .match-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;cursor:pointer;transition:all .15s;}
    .match-card:hover{border-color:rgba(74,222,128,.3);transform:translateY(-1px);}
    .mc-type{font-size:9px;font-weight:700;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
    .match-card h4{font-size:13px;font-weight:700;margin-bottom:3px;}
    .match-card p{font-size:11px;color:var(--muted);line-height:1.4;}
    .mc-meta{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;}
    .mc-r{color:var(--warm);font-size:10px;font-weight:600;}
    .mc-v{font-size:9px;color:var(--accent);background:rgba(74,222,128,.1);padding:1px 6px;border-radius:10px;}
    .mc-p{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent2);}
    .quick-row{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .q-btn{flex:1;padding:8px 4px;border-radius:9px;font-size:11px;font-weight:600;cursor:pointer;border:none;text-align:center;transition:all .15s;}
    .q-btn.on{outline:2px solid currentColor;}

    .post-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px;transition:all .13s;}
    .post-card:hover{border-color:rgba(255,255,255,.12);}
    .pt{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
    .p-av{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:16px;}
    .p-auth{font-size:12px;font-weight:600;}
    .p-ago{font-size:10px;color:var(--muted);}
    .p-tag{margin-left:auto;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600;white-space:nowrap;}
    .p-loc{font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(96,165,250,.1);color:#60a5fa;margin-left:4px;}
    .p-title{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.4;}
    .p-body{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px;}
    .p-acts{display:flex;gap:12px;font-size:10px;color:var(--muted);}
    .p-act{display:flex;align-items:center;gap:3px;cursor:pointer;user-select:none;}
    .p-act:hover{color:var(--accent);}
    .p-act.liked{color:var(--accent3);}

    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--bottom-h);
      background:rgba(11,13,20,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);
      display:flex;align-items:center;padding:0 8px;padding-bottom:env(safe-area-inset-bottom,0px);}
    .bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 4px;border-radius:10px;transition:all .15s;}
    .bn-btn:hover,.bn-btn.active{background:var(--surface2);}
    .bn-ico{font-size:20px;line-height:1;}
    .bn-label{font-size:9px;color:var(--muted);font-weight:500;white-space:nowrap;}
    .bn-btn.active .bn-label{color:var(--accent);}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-end;justify-content:center;}
    .modal-bg.show{display:flex;}
    @media(min-width:600px){.modal-bg.show{align-items:center;}}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;animation:slideUp .25s ease;}
    @media(min-width:600px){.modal{border-radius:20px;}}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
    .modal h3{font-size:17px;font-weight:700;margin-bottom:4px;}
    .modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
    .modal-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
    .modal-row span:first-child{color:var(--muted);}
    .modal-btns{display:flex;gap:8px;margin-top:18px;}
    .modal-btn{flex:1;padding:12px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;border:none;}
    .write-inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:9px;}
    .write-inp:focus{border-color:var(--accent);}
    textarea.write-inp{resize:vertical;min-height:90px;}
    .toast{position:fixed;bottom:calc(var(--bottom-h) + 16px);left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:11px 20px;border-radius:12px;font-size:13px;z-index:600;display:none;box-shadow:0 12px 32px rgba(0,0,0,.5);}
    .toast.show{display:block;animation:msgIn .25s ease;}

    .mapboxgl-popup-content{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:12px!important;padding:13px 15px!important;color:var(--text)!important;font-family:'Noto Sans KR',sans-serif!important;min-width:170px;box-shadow:0 16px 40px rgba(0,0,0,.5)!important;}
    .mapboxgl-popup-tip{border-top-color:var(--surface)!important;border-bottom-color:var(--surface)!important;}
    .pop-name{font-weight:700;font-size:13px;margin-bottom:3px;}
    .pop-type{font-size:9px;font-weight:600;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:7px;}
    .pop-meta{font-size:10px;color:var(--muted);margin-bottom:2px;}
    .pop-r{color:var(--warm);font-size:11px;font-weight:700;}
    .pop-btn{display:block;margin-top:9px;background:var(--accent);color:#000;text-align:center;padding:7px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:none;width:100%;}
  </style>
</head>
<body>

<div class="top-nav">
  <div class="logo" onclick="switchTab('map')"><div class="logo-icon">🐾</div>펫메이트</div>
  <div class="search-box">
    <span class="search-ico">🔍</span>
    <input class="search-inp" id="searchInp" placeholder="병원·워커·호스트 검색" oninput="doSearch(this.value)" onblur="setTimeout(()=>document.getElementById('searchResults').classList.remove('show'),200)"/>
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="nav-btns">
    <button class="nav-btn nav-btn-primary" onclick="toast('회원가입은 곧 오픈됩니다! 🐾')">가입</button>
  </div>
</div>

<div class="ticker">
  <div class="ticker-label">🐾 뉴스</div>
  <div style="overflow:hidden;flex:1;"><div class="ticker-track" id="tickerTrack"></div></div>
</div>

<div class="content-tabs">
  <div class="c-tab active" id="ctab-map" onclick="switchTab('map')">🗺 지도</div>
  <div class="c-tab" id="ctab-chat" onclick="switchTab('chat')">💬 채팅방</div>
  <div class="c-tab" id="ctab-matching" onclick="switchTab('matching')">🤝 매칭</div>
  <div class="c-tab" id="ctab-community" onclick="switchTab('community')">📋 커뮤니티</div>
</div>

<div class="main-area">
  <!-- MAP -->
  <div class="tab-panel active" id="panel-map" style="position:relative;">
    <div id="map"></div>
    <div class="map-filters">
      <button class="mf-btn on" onclick="toggleF(this,'hospital')">🏥 동물병원</button>
      <button class="mf-btn on" onclick="toggleF(this,'hotel')">🏨 펫호텔</button>
      <button class="mf-btn on" onclick="toggleF(this,'walker')">🦮 도그워커</button>
      <button class="mf-btn on" onclick="toggleF(this,'grooming')">✂️ 그루밍</button>
      <button class="mf-btn on" onclick="toggleF(this,'host')">🏠 호스트</button>
    </div>
    <div class="map-view-btns">
      <div class="mv-btn" id="locBtn" onclick="goMyLocation()" title="내 위치">📍</div>
      <div class="mv-btn" onclick="map.easeTo({pitch:55,bearing:-20,duration:700})" title="3D">🏔</div>
      <div class="mv-btn" onclick="map.easeTo({pitch:0,bearing:0,duration:700})" title="2D">🗺</div>
      <div class="mv-btn" onclick="map.easeTo({zoom:map.getZoom()+1})">＋</div>
      <div class="mv-btn" onclick="map.easeTo({zoom:map.getZoom()-1})">－</div>
    </div>
    <div class="map-legend">
      <div class="leg-row"><div class="leg-dot" style="background:#4ade80"></div>동물병원</div>
      <div class="leg-row"><div class="leg-dot" style="background:#60a5fa"></div>펫호텔</div>
      <div class="leg-row"><div class="leg-dot" style="background:#f472b6"></div>도그워커</div>
      <div class="leg-row"><div class="leg-dot" style="background:#fbbf24"></div>그루밍</div>
      <div class="leg-row"><div class="leg-dot" style="background:#a78bfa"></div>호스트</div>
    </div>
    <div class="map-count" id="mapCount"></div>
  </div>

  <!-- CHAT -->
  <div class="tab-panel" id="panel-chat">
    <div class="chat-panel-inner">
      <div class="chat-sidebar" id="chatSidebar"></div>
      <div class="chat-main">

// ═══ 내 위치 ═══
let myLL=null;
function distKm(a,b){
  const R=6371,dLat=(b[1]-a[1])*Math.PI/180,dLng=(b[0]-a[0])*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function goMyLocation(){
  if(!navigator.geolocation){toast('위치 서비스를 지원하지 않는 브라우저예요');return;}
  const btn=document.getElementById('locBtn');btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.classList.remove('locating');
    const ll=[pos.coords.longitude,pos.coords.latitude];
    myLL=ll;
    renderMatch(); // 거리순 갱신
    if(myMarker)myMarker.remove();
    const el=document.createElement('div');
    el.style.cssText='width:20px;height:20px;border-radius:50%;background:#60a5fa;border:3px solid #fff;box-shadow:0 0 0 8px rgba(96,165,250,.25);';
    myMarker=new mapboxgl.Marker({element:el}).setLngLat(ll).addTo(map);
    map.flyTo({center:ll,zoom:14,duration:1500});
    toast('📍 내 위치로 이동했어요');
  },()=>{btn.classList.remove('locating');toast('위치 권한을 허용해주세요');},{timeout:8000});
}

function doSearch(q){

  const hits=places.filter(p=>p.name.includes(q)||p.addr.includes(q)||typeKr[p.t].includes(q)||p.note.includes(q)).slice(0,6);
  if(!hits.length){box.innerHTML='<div class="sr-item" style="color:var(--muted)">검색 결과가 없어요</div>';box.classList.add('show');return;}
  box.innerHTML='';
  hits.forEach(p=>{
    const d=document.createElement('div');d.className='sr-item';
    d.innerHTML=`${p.e} <div><div style="font-weight:600">${p.name}</div><div style="font-size:10px;color:var(--muted)">📍 ${p.addr}</div></div>`;
    d.onclick=()=>{
      switchTab('map');
      map.flyTo({center:p.ll,zoom:15,duration:1400});
      box.classList.remove('show');
      document.getElementById('searchInp').value='';
      const found=markers.find(m=>m.place===p);
      if(found)setTimeout(()=>found.mk.togglePopup(),1500);
    };
    box.appendChild(d);
  });
  box.classList.add('show');
}

let currentRoomName='강아지';
let currentRoomDesc='강아지 보호자 2,143명 온라인';
// localStorage에 채팅 저장
function loadChat(room){
  try{const s=localStorage.getItem('pm_chat_'+room);if(s)return JSON.parse(s);}catch(e){}
  return chatSeed[room]?[...chatSeed[room]]:[];
}
function saveChat(room,msgs){
  try{localStorage.setItem('pm_chat_'+room,JSON.stringify(msgs.slice(-50)));}catch(e){}
}
let chatMsgs=loadChat('강아지');

function renderChat(){
  const box=document.getElementById('chatMsgs');box.innerHTML='';
  chatMsgs.forEach(m=>{
    const d=document.createElement('div');d.className='msg'+(m.mine?' mine':'');
    d.innerHTML=`<div class="msg-av">${m.av}</div><div>${!m.mine?`<div class="msg-nm">${esc(m.u)}</div>`:''}
      <div class="msg-bub">${esc(m.msg)}</div><div class="msg-t">${m.t}</div></div>`;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
function buildSidebar(){
  const sb=document.getElementById('chatSidebar');sb.innerHTML='<div class="cs-label">종별</div>';
  speciesRooms.forEach((r,i)=>{
    const d=document.createElement('div');d.className='room-btn'+(i===0?' active':'');
    d.innerHTML=`<div class="rb-ico" style="background:${r.c}1f">${r.ico}</div><span class="rb-name">${r.name}</span><span class="rb-cnt">${r.cnt}</span>`;
    d.onclick=()=>enterRoom(d,r.name,r.ico,r.c,r.desc);
    sb.appendChild(d);
  });
  const lbl=document.createElement('div');lbl.className='cs-label';lbl.textContent='연령대';sb.appendChild(lbl);
  ageRooms.forEach(r=>{
    const d=document.createElement('div');d.className='age-btn';
    d.innerHTML=`<div class="age-badge" style="background:${r.c}26;color:${r.c};">${r.name}</div><span class="rb-cnt" style="margin-left:auto">${r.cnt}</span>`;
    d.onclick=()=>enterRoom(d,r.name,'💬',r.c,r.name+' 보호자 소통 공간');
    sb.appendChild(d);
  });
}
function enterRoom(el,name,ico,color,desc){
  document.querySelectorAll('.room-btn,.age-btn').forEach(r=>r.classList.remove('active'));
  el.classList.add('active');
  currentRoomName=name;
  currentRoomDesc=desc;
  document.getElementById('chatIco').textContent=ico;
  document.getElementById('chatIco').style.background=color+'1f';
  document.getElementById('chatName').textContent=name+' 채팅방';
  document.getElementById('chatDesc').textContent=desc;
  chatMsgs=loadChat(name);
  renderChat();
  switchTab('chat');
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function nowT(){const t=new Date();return `${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;}
function sendMsg(){
  const inp=document.getElementById('chatInp');const txt=inp.value.trim();if(!txt)return;
  chatMsgs.push({u:'나',av:'🐾',msg:txt,t:nowT(),mine:true});
  saveChat(currentRoomName,chatMsgs);renderChat();inp.value='';
  // 자동 응답 (살아있는 느낌)
  const pool=botReplies[currentRoomName]||botReplies['default'];
  const [u,av,msg]=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('chatDesc').innerHTML=`${u}님이 입력 중<span class="typing-dot">...</span>`;
  setTimeout(()=>{
    chatMsgs.push({u,av,msg,t:nowT()});
    saveChat(currentRoomName,chatMsgs);renderChat();
    document.getElementById('chatDesc').textContent=currentRoomDesc;
  },1500+Math.random()*1500);
}

// ═══ MATCHING ═══
const matchData=places.map(p=>({t:typeKr[p.t],e:p.e,name:p.name,desc:p.note+' · '+p.addr,r:p.r+'('+p.rv+')',p:p.p,v:p.rv>=4.7,raw:p}));
let matchFilter=null;
function filterMatch(btn){
  const f=btn.dataset.f;
  document.querySelectorAll('.q-btn').forEach(b=>b.classList.remove('on'));
  if(matchFilter===f){matchFilter=null;}
  else{matchFilter=f;btn.classList.add('on');}
  renderMatch();
}
function renderMatch(){
  const mg=document.getElementById('matchGrid');mg.innerHTML='';
  let list=matchData.filter(m=>!matchFilter||m.t===matchFilter);
  if(myLL){ // 내 위치 있으면 거리순 정렬
    list=list.map(m=>({...m,dist:distKm(myLL,m.raw.ll)})).sort((a,b)=>a.dist-b.dist);
  }
  list.forEach(m=>{
    const c=document.createElement('div');c.className='match-card';
    const distBadge=m.dist!==undefined?`<span style="font-size:9px;color:var(--accent2);background:rgba(96,165,250,.1);padding:1px 6px;border-radius:10px;">📍 ${m.dist<1?(m.dist*1000).toFixed(0)+'m':m.dist.toFixed(1)+'km'}</span>`:'';
    c.innerHTML=`<div class="mc-type">${m.e} ${m.t}</div><h4>${m.name}</h4><p>${m.desc}</p>
      <div class="mc-meta"><span class="mc-r">${m.r}</span>${m.v?'<span class="mc-v">✓ 인증</span>':''}${distBadge}<span class="mc-p">${m.p}</span></div>`;
    c.onclick=()=>openBook(m.raw);
    mg.appendChild(c);
  });
}

  document.getElementById('bmRating').textContent=p.r+' ('+p.rv+')';

}

try{const saved=localStorage.getItem('pm_posts');if(saved)posts=[...JSON.parse(saved),...posts];}catch(e){}
const likedSet=new Set(JSON.parse(localStorage.getItem('pm_likes')||'[]'));

function renderPosts(){
  const pc=document.getElementById('commPosts');pc.innerHTML='';
  posts.forEach((p,i)=>{
    const tc=tagColors[p.tag]||'#7b849a';
    const liked=likedSet.has(p.title);
    const d=document.createElement('div');d.className='post-card';
    d.innerHTML=`<div class="pt">
      <div class="p-av">${p.av}</div>
      <div><div class="p-auth">${esc(p.auth)}<span class="p-loc">📍${esc(p.loc)}</span></div><div class="p-ago">${p.ago}</div></div>
      <span class="p-tag" style="background:${tc}18;color:${tc};">${esc(p.tag)}</span>
    </div>
    <div class="p-title">${esc(p.title)}</div>
    <div class="p-body">${esc(p.body)}</div>
    <div class="p-acts">
      <span class="p-act ${liked?'liked':''}" onclick="toggleLike(${i},this)">❤️ <span>${p.likes+(liked?1:0)}</span></span>
      <span class="p-act">💬 ${p.comments}</span>
      <span class="p-act">👁 ${p.views}</span>
      <span class="p-act" style="margin-left:auto;" onclick="sharePost('${esc(p.title).replace(/'/g,'')}')">공유 ↗</span>
    </div>`;
    pc.appendChild(d);
  });
}
function toggleLike(i,el){
  const p=posts[i];
  if(likedSet.has(p.title)){likedSet.delete(p.title);}else{likedSet.add(p.title);}
  localStorage.setItem('pm_likes',JSON.stringify([...likedSet]));
  renderPosts();
}
function openWrite(){document.getElementById('writeModal').classList.add('show');}
function submitPost(){
  const title=document.getElementById('wTitle').value.trim();
  const body=document.getElementById('wBody').value.trim();
  const tag=document.getElementById('wTag').value;
  if(!title||!body){toast('제목과 내용을 입력해주세요!');return;}
  const newPost={av:'🐾',auth:'나',ago:'방금 전',tag,loc:'우리 동네',title,body,likes:0,comments:0,views:1};
  posts.unshift(newPost);
  // 유저 글만 저장
  const userPosts=posts.filter(p=>p.auth==='나');
  try{localStorage.setItem('pm_posts',JSON.stringify(userPosts));}catch(e){}
  renderPosts();
  document.getElementById('writeModal').classList.remove('show');
  document.getElementById('wTitle').value='';document.getElementById('wBody').value='';
  toast('✏️ 글이 등록됐어요!');
}

// ═══ 공유 ═══
function sharePost(title){
  const url=location.href;
  if(navigator.share){
    navigator.share({title:'펫메이트 — '+title,url}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(url+' — '+title).then(()=>toast('링크가 복사됐어요 📋')).catch(()=>toast('복사 실패'));
  }
}

// ═══ iOS 키보드 대응 (fixed 레이아웃 보호) ═══
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{
    const kb=window.innerHeight-window.visualViewport.height;
    document.querySelector('.bottom-nav').style.display=kb>150?'none':'flex';
  });
}
