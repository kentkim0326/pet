<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetChain — 대한민국 온체인 펫 평판 지도</title>
  <meta name="description" content="전국 반려동물 병원, 호텔, 유치원, 카페를 온체인 평판으로 연결" />
  
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #05070f;
      --accent: #7cdbff;
      --accent2: #c084fc;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: #f0f4ff;
    }
    .container { max-width: 1320px; margin: 0 auto; padding: 0 28px; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(5,7,15,0.96); backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(124,219,255,0.15);
    }
    .nav-inner { min-height: 84px; display: flex; align-items: center; justify-content: space-between; }

    .logo {
      font-size: 28px; font-weight: 800; display: flex; align-items: center; gap: 12px;
    }
    .logo-dot {
      width: 52px; height: 52px; background: linear-gradient(135deg, #7cdbff, #c084fc);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #05070f; font-weight: 900;
    }

    .hero { height: 100vh; min-height: 820px; display: flex; align-items: center; position: relative; }
    .hero h1 { font-size: clamp(54px, 8.5vw, 96px); line-height: 1.05; letter-spacing: -0.05em; }

    #map { width: 100%; height: 760px; border-radius: 28px; }
    .map-wrapper { 
      border-radius: 32px; overflow: hidden; 
      box-shadow: 0 30px 80px rgba(0,0,0,0.65); 
      border: 1px solid rgba(124,219,255,0.25);
    }

    .map-ui {
      position: absolute; top: 32px; left: 32px; z-index: 10;
      background: rgba(10,14,35,0.97); padding: 24px; border-radius: 20px;
      border: 1px solid rgba(124,219,255,0.3); min-width: 290px;
    }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 32px; }
    .card {
      background: rgba(13,18,40,0.9); border: 1px solid rgba(124,219,255,0.15);
      border-radius: 28px; padding: 42px 36px;
    }
    .btn {
      padding: 18px 48px; font-size: 18px; font-weight: 700;
      background: linear-gradient(90deg, #7cdbff, #c084fc);
      color: #05070f; border: none; border-radius: 9999px; cursor: pointer;
    }
  </style>
</head>
<body>

  <nav>
    <div class="container nav-inner">
      <div class="logo">
        <div class="logo-dot">P</div>
        PetChain
      </div>
      <div style="color:#7cdbff; font-weight:600;">전국 온체인 펫 평판 지도</div>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1 style="text-align:center">반려동물의 모든 공간을<br>신뢰로 연결합니다</h1>
    </div>
  </section>

  <!-- 고해상도 MAP -->
  <section style="padding:40px 0">
    <div class="container">
      <div class="map-wrapper">
        <div id="map"></div>

        <div class="map-ui">
          <h3>📍 실시간 장소 필터</h3>
          <div style="margin:18px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:15px">
            <label><input type="checkbox" checked> 🏥 병원</label>
            <label><input type="checkbox" checked> 🏨 호텔</label>
            <label><input type="checkbox" checked> 🐾 유치원</label>
            <label><input type="checkbox" checked> ☕ 카페</label>
            <label><input type="checkbox" checked> ✂️ 그루밍</label>
          </div>
          <small style="color:#34d399">● NFT 인증 장소</small>
        </div>
      </div>
    </div>
  </section>

  <!-- 나머지 섹션 -->
  <section>
    <div class="container">
      <div class="cards">
        <div class="card">
          <h3>Pet ID (SBT)</h3>
          <p>반려동물 평생 신원. 혈통·의료·산책 이력이 온체인에 안전하게 기록됩니다.</p>
        </div>
        <div class="card">
          <h3>Medical NFT</h3>
          <p>수의사 EMR 연동 발행. 해외 검역 시 QR 하나로 즉시 증명.</p>
        </div>
        <div class="card">
          <h3>온체인 평판 지도</h3>
          <p>실제 방문 + NFT 인증된 리뷰만 표시. 가짜 리뷰 완전 차단.</p>
        </div>
      </div>
    </div>
  </section>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openstreetmaps.org/styles/basic.json', // 더 상세한 스타일
      center: [127.0, 37.55],   // 서울 중심
      zoom: 11.5,               // 서울 상세 레벨
      pitch: 45,
      bearing: -15
    });

    map.on('load', () => {
      // 서울 + 주요 도시 마커
      const places = [
        {lng:127.0276, lat:37.4980, name:"코엑스 펫호텔", type:"hotel", score:"4.9", nft:true},
        {lng:127.112, lat:37.402, name:"분당 펫메디컬", type:"hospital", score:"4.95", nft:true},
        {lng:126.978, lat:37.566, name:"강남 중앙동물병원", type:"hospital", score:"4.98", nft:true},
        {lng:126.91, lat:37.55, name:"망원 펫유치원", type:"daycare", score:"4.85"},
        {lng:129.085, lat:35.18, name:"해운대 펫카페", type:"cafe", score:"4.7"},
      ];

      places.forEach(place => {
        const el = document.createElement('div');
        el.style.width = '42px';
        el.style.height = '42px';
        el.style.background = place.nft ? '#34d399' : '#7cdbff';
        el.style.border = '4px solid #fff';
        el.style.borderRadius = '50%';
        el.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
        el.style.fontSize = '22px';
        el.innerHTML = place.type === 'hospital' ? '🏥' : 
                       place.type === 'hotel' ? '🏨' : 
                       place.type === 'daycare' ? '🐾' : '☕';

        new maplibregl.Marker({element: el})
          .setLngLat([place.lng, place.lat])
          .setPopup(new maplibregl.Popup({offset: 30}).setHTML(`
            <strong>${place.name}</strong><br>
            평점 <b>${place.score}</b> ${place.nft ? '<span style="color:#34d399">• NFT 인증</span>' : ''}
          `))
          .addTo(map);
      });

      // 서울 중심으로 부드럽게 이동
      map.flyTo({ center: [127.0, 37.55], zoom: 11.8, duration: 1800 });
    });
  </script>
</body>
</html>
